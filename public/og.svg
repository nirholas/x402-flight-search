<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="x402 Flight Search">
  <rect width="1200" height="630" fill="#0b0c10"/>
  <rect width="1200" height="6" fill="#0052ff"/>
  <g transform="translate(96 148)">
    <rect width="96" height="96" rx="21" fill="#0052ff"/>
    <g transform="translate(-0 -0) scale(1.5)"><path d="M53 11 L9 30 L26 36.5 L32.5 53 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M53 11 L26 36.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  </g>
  <text x="96" y="330" fill="#e8eaf2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="700">x402 Flight Search</text>
  <text x="96" y="396" fill="#9aa1b5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34">Flight offers, live pricing and pay-per-poll fare checks.</text>
  <text x="96" y="446" fill="#9aa1b5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34">A fraction of a cent per query, in USDC on Base or Solana.</text>
